server:
  port: 8080

spring:
  datasource:
    url: jdbc:h2:file:./data/portfolio_db;DB_CLOSE_ON_EXIT=FALSE;AUTO_RECONNECT=TRUE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  h2:
    console:
      enabled: true
      path: /h2-console

# Admin credentials for the built-in CMS
admin:
  username: ${ADMIN_USER:admin}
  password: ${ADMIN_PASS:admin123}
